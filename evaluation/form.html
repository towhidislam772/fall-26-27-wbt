<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation Form</title>
</head>

<body>
    <form method="post">

        <table>
            <h2>Donor Information</h2>
            <tr>
                <td><label for="fname">First Name*</label></td>
                <td><input type="text" id="fname" name="fname" required></td>
            </tr>
            <tr>
                <td><label for="lname">Last Name*</label></td>
                <td><input type="text" id="lname" name="lname" required></td>
            </tr>
            <tr>
                <td><label for="company">Company</label></td>
                <td><input type="text" id="company" name="company"></td>
            </tr>
            <tr>
                <td><label for="add1">Address 1*</label></td>
                <td><input type="text" id="add1" name="add1" required></td>
            </tr>
            <tr>
                <td><label for="add2">Address 2*</label></td>
                <td><input type="text" id="add2" name="add2" required></td>
            </tr>
            <tr>
                <td><label for="city">City*</label></td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>
            <tr>
                <td><label for="state">State*</label></td>
                <td>
                    <select id="state" name="state" required>
                        <option>Select a State</option>
                        <option>NY</option>
                        <option>Las Vegas</option>
                        <option>Miami</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="zip">Zip Code*</label></td>
                <td><input type="number" id="zip" name="zip" required></td>
            </tr>
            <tr>
                <td><label for="country">Country*</label></td>
                <td>
                    <select id="country" name="country" required>
                        <option>Select a country</option>
                        <option>BD</option>
                        <option>Usa</option>
                        <option>uk</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="phone">Phone</label></td>
                <td><input type="tel" id="phone" name="phone"></td>
            </tr>
            <tr>
                <td><label for="fax">Fax</label></td>
                <td><input type="text" id="fax" name="fax"></td>
            </tr>
            <tr>
                <td><label for="email">Email*</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="damount">Donation Amount*<br>
                        (check a button or type in your amount)</label></td>
                <td>
                    <input type="radio" name="damount" value="none">None
                    <input type="radio" name="damount" value="50">$50
                    <input type="radio" name="damount" value="75">$75
                    <input type="radio" name="damount" value="100">$100
                    <input type="radio" name="damount" value="250">$250
                    <input type="radio" name="damount" value="other">Other
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="damountm">Other Amount $ <input type="number" id="damountm" name="damountm"></label>
                </td>
            </tr>
            <tr>
                <td><label for="rdonation">Recurring Donation<br>
                        (check if yes)</label></td>
                <td>
                    <input type="checkbox" name="rdonation" value="interested">I am interested in giving on a regular
                    basis.
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="rdonation1">Monthly Credit Card $ <input type="number" id="rdonation1"
                            name="rdonation1">
                        for <input type="number" id="rdonation1" name="rdonation1"> months</label>
                </td>
            </tr>
        </table>
        <table>
            <h2>Honorarium and Memorial Donation Information</h2>
            <tr>
                <td><label for="dreason">I would like to make this<br>
                        donation</label></td>
                <td>
                    <input type="radio" name="dreason" value="honor">To Honor <br>
                    <input type="radio" name="dreason" value="memory">In Memory of

                </td>
            </tr>
            <tr>
                <td><label for="name">Name</label></td>
                <td><input type="text" id="name" name="name"></td>
            </tr>
            <tr>
                <td><label for="dto">Acknowledge Donation to</label></td>
                <td><input type="text" id="dto" name="dto"></td>
            </tr>
            <tr>
                <td><label for="address">Adress</label></td>
                <td><input type="text" id="address" name="address"></td>
            </tr>
            <tr>
                <td><label for="city">City</label></td>
                <td><input type="text" id="city" name="city"></td>
            </tr>
            <tr>
                <td><label for="state">State</label></td>
                <td>
                    <select id="state" name="state">
                        <option>Select a State</option>
                        <option>NY</option>
                        <option>Las Vegas</option>
                        <option>Miami</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="zip">Zip Code</label></td>
                <td><input type="number" id="zip" name="zip"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="reset">
                    <input type="submit" value="Continue">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
